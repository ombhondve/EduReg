<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EduReg</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#050508}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:'DM Sans',sans-serif;
    perspective:600px;perspective-origin:50% 50%;
  }
  .scene{
    position:relative;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    transform-style:preserve-3d;
    animation:sceneOut .5s ease 2.3s forwards;
  }
  .ribbon{
    position:absolute;width:140px;height:140px;
    border:3px solid #e94560;border-radius:50%;
    opacity:0;transform-style:preserve-3d;
  }
  .ribbon:nth-child(1){animation:flyThrough 1.4s cubic-bezier(0.55,0,0.85,1) .1s forwards}
  .ribbon:nth-child(2){animation:flyThrough 1.4s cubic-bezier(0.55,0,0.85,1) .28s forwards}
  .ribbon:nth-child(3){animation:flyThrough 1.4s cubic-bezier(0.55,0,0.85,1) .46s forwards}
  .ribbon:nth-child(4){animation:flyThrough 1.4s cubic-bezier(0.55,0,0.85,1) .64s forwards}
  .ribbon:nth-child(5){animation:flyThrough 1.4s cubic-bezier(0.55,0,0.85,1) .82s forwards}

  @keyframes flyThrough{
    0%{opacity:0;transform:translateZ(-1400px) scale(0.3)}
    12%{opacity:1}
    70%{opacity:0.9}
    100%{opacity:0;transform:translateZ(500px) scale(2.6)}
  }

  .wordmark{
    position:relative;font-family:'Playfair Display',serif;font-weight:700;
    font-size:2.4rem;letter-spacing:10px;color:#fff;
    opacity:0;transform:scale(0.9);
    text-shadow:0 0 40px rgba(233,69,96,0.9);
    animation:lockIn .6s cubic-bezier(0.22,1,0.36,1) 1.55s forwards;
  }
  .wordmark span{color:#e94560}

  @keyframes lockIn{
    0%{opacity:0;transform:scale(1.5)}
    60%{opacity:1;transform:scale(0.95)}
    100%{opacity:1;transform:scale(1);text-shadow:0 0 0 rgba(233,69,96,0)}
  }

  @keyframes sceneOut{to{opacity:0;visibility:hidden}}

  @media (prefers-reduced-motion:reduce){
    .ribbon,.wordmark,.scene{animation:none!important;opacity:1!important;transform:none!important}
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="ribbon"></div>
    <div class="ribbon"></div>
    <div class="ribbon"></div>
    <div class="ribbon"></div>
    <div class="ribbon"></div>
    <div class="wordmark">EDU<span>REG</span></div>
  </div>
  <script src="static/js/index-intro.js"></script>
</body>
</html>
