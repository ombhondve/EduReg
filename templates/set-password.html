<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Password | EduReg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/auth-panel-theme.css">
</head>
<body>

  <div class="auth-card">
    <div class="brand-logo">
      <span class="brand-logo-text">Edu<span class="brand-logo-accent">Reg</span></span>
    </div>
    <h1 class="auth-title">Set your password</h1>
    <p class="auth-subtitle">Choose a strong password to secure your registrar account</p>

    <form id="setPasswordForm" novalidate>

      <div class="field-block">
        <label class="field-label" for="newPassword">NEW PASSWORD</label>
        <div class="input-shell">
          <input type="password" id="newPassword" name="newPassword" placeholder="Enter your password" autocomplete="new-password" required>
          <button type="button" class="visibility-toggle" data-target="newPassword" aria-label="Show password">
            <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <div class="strength-meter">
          <div class="strength-track">
            <span class="strength-fill" id="strengthFill"></span>
          </div>
          <span class="strength-label" id="strengthLabel">Password strength</span>
        </div>

        <ul class="requirement-list" id="requirementList">
          <li data-rule="length"><span class="req-dot"></span>At least 8 characters</li>
          <li data-rule="upper"><span class="req-dot"></span>One uppercase letter</li>
          <li data-rule="lower"><span class="req-dot"></span>One lowercase letter</li>
          <li data-rule="number"><span class="req-dot"></span>One number</li>
          <li data-rule="special"><span class="req-dot"></span>One special character</li>
        </ul>
      </div>

      <div class="field-block">
        <label class="field-label" for="confirmPassword">CONFIRM PASSWORD</label>
        <div class="input-shell">
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" required>
          <button type="button" class="visibility-toggle" data-target="confirmPassword" aria-label="Show password">
            <svg class="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <p class="match-hint" id="matchHint"></p>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn" disabled>Set Password</button>
      <p class="form-status" id="formStatus"></p>
    </form>
  </div>

<script src="static/js/password-strength-engine.js"></script>
</body>
</html>
