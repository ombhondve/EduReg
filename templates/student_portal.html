<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portal — EduReg</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/css/style.css">
<link rel="stylesheet" href="static/css/studentportal.css">
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="app">
  <aside class="sidebar">
    <div class="logo-area">
      <div class="logo">Edu<span>Reg</span></div>
      <div class="logo-sub">Student Portal</div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-section">Main</div>
      <div class="nav-item active" data-page="dashboard">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span>Dashboard</span>
      </div>
      <div class="nav-item" data-page="profile">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>My Profile</span>
      </div>
      <div class="nav-item" data-page="courses">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        <span>My Courses</span>
      </div>
      <div class="nav-item" data-page="grades">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        <span>My Grades</span>
      </div>
      <div class="nav-section">Records</div>
      <div class="nav-item" data-page="timetable">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
        <span>Timetable</span>
      </div>
      <div class="nav-item" data-page="calendar">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Calendar</span>
      </div>
      <div class="nav-item" data-page="attendance">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Attendance</span>
      </div>
      <div class="nav-item" data-page="documents">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>Documents</span>
        <span class="nav-badge" id="docBadge" style="display:none">0</span>
      </div>
      <div class="nav-item" data-page="fees">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        <span>Fee Status</span>
      </div>
      <div class="nav-section">Communication</div>
      <div class="nav-item" data-page="messages">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Messages</span>
      </div>
      <div class="nav-item" data-page="notices">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span>Notices</span>
        <span class="nav-badge" id="noticeBadge" style="display:none">0</span>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-card">
        <div class="avatar" id="spAvatar">ST</div>
        <div class="user-info">
          <p id="spUserName">Student</p>
          <span id="spUserRoll">Roll no.</span>
        </div>
        <button class="logout-btn" title="Log out" data-action="logout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="page-title">
        <span id="spPageTitle">Dashboard</span>
        <small id="spPageSubtitle">Welcome back</small>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-secondary btn-sm" data-action="navigate" data-page="notices">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>
      </div>
    </header>

    <div class="content" id="spMainContent"></div>
  </div>
</div>

<!-- Upload Document Modal -->
<div class="modal-overlay" id="spDocUploadModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Upload document</div>
      <button class="btn-icon" data-action="close-overlay" data-modal="spDocUploadModal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group" style="margin-bottom:1.2rem">
        <label>Document type *</label>
        <select class="form-select" id="spDocType">
          <option>ID Proof</option><option>10th Marksheet</option><option>12th Marksheet</option>
          <option>Transfer Certificate</option><option>Migration Certificate</option><option>Photo</option><option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>File *</label>
        <div class="import-dropzone" data-action="trigger-file" data-target="spDocFileInput">
          <span id="spDocFileLabel">📄 Click to choose a file</span>
        </div>
        <input type="file" id="spDocFileInput" style="display:none">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-action="close-overlay" data-modal="spDocUploadModal">Cancel</button>
      <button class="btn btn-primary" data-action="submit-doc-upload">Upload</button>
    </div>
  </div>
</div>

<!-- Digital ID Card Modal -->
<div class="modal-overlay" id="spIdCardModal">
  <div class="modal" style="max-width:380px">
    <div class="modal-header">
      <div class="modal-title">Digital ID card</div>
      <button class="btn-icon" data-action="close-overlay" data-modal="spIdCardModal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="spIdCardBody" style="display:flex;justify-content:center;background:var(--surface2)"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" data-action="print">🖨️ Print</button>
      <button class="btn btn-primary" data-action="close-overlay" data-modal="spIdCardModal">Done</button>
    </div>
  </div>
</div>

<script src="static/js/api-client.js"></script>
<script src="static/js/student-api-client.js"></script>
<script src="static/js/studentportal.js"></script>
</body>
</html>
